<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Booster — Otimizar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root{--bg:#0A0E1F;--bg-soft:#0F1430;--ink:#EAF0FF;--ink-dim:#93A0C4;--blue:#1E90FF;--purple:#8A2BE2;--ok:#34D399;--line:rgba(234,240,255,.10);--card:rgba(255,255,255,.03);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#F5F7FD;--bg-soft:#FFF;--ink:#0A0E1F;--ink-dim:#4A5578;--ok:#059669;--line:rgba(10,14,31,.10);--card:rgba(10,14,31,.03);color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F5F7FD;--bg-soft:#FFF;--ink:#0A0E1F;--ink-dim:#4A5578;--ok:#059669;--line:rgba(10,14,31,.10);--card:rgba(10,14,31,.03);color-scheme:light}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;position:relative}
h1,h2,h3,.brand,.num{font-family:'Space Grotesk','Inter',system-ui,sans-serif}
.glow{position:fixed;top:-200px;right:-160px;width:600px;height:600px;background:radial-gradient(circle,color-mix(in srgb,var(--purple) 32%,transparent),transparent 70%);pointer-events:none}
.glow.b{top:auto;bottom:-260px;right:auto;left:-200px;background:radial-gradient(circle,color-mix(in srgb,var(--blue) 22%,transparent),transparent 70%)}
.app{position:relative;max-width:520px;margin:0 auto;padding:0 22px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.1rem}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));display:inline-flex;padding:4px}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.plan-pill{font-size:.78rem;color:var(--ink-dim);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.hello{margin-top:8px;text-align:center}
.hello h1{font-size:1.7rem;font-weight:600;letter-spacing:-.02em}
.hello p{margin-top:8px;color:var(--ink-dim);font-size:.98rem}
.stage{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:34px auto 26px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:url(#rg);stroke-dasharray:754;stroke-dashoffset:754;transition:stroke-dashoffset .2s linear}
.pulse{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--blue) 28%,transparent),transparent 70%);animation:pulse 2.8s ease-in-out infinite}
.running .pulse{animation-duration:1s}
@keyframes pulse{50%{transform:scale(1.12);opacity:.6}}
.go{position:absolute;inset:11%;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 18px 50px -12px color-mix(in srgb,var(--purple) 70%,transparent);transition:transform .2s;font-family:inherit}
.go:hover{transform:scale(1.03)}.go:active{transform:scale(.97)}.go:disabled{cursor:default;transform:none}
.go svg{width:46px;height:46px}
.go .lbl{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1.25rem}
.go .pct{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:2.4rem}
.go.done{background:linear-gradient(135deg,#10B981,var(--blue))}
.status{text-align:center;min-height:48px;color:var(--ink-dim);font-size:.98rem}
.status strong{display:block;color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:1.1rem;margin-bottom:4px}
.modes{display:flex;gap:8px;justify-content:center;margin:6px 0 28px;flex-wrap:wrap}
.mode{font:inherit;font-size:.9rem;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-dim);cursor:pointer;transition:all .2s}
.mode:disabled{opacity:.5;cursor:default}
.mode.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--purple))}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 14px}
.card small{display:block;color:var(--ink-dim);font-size:.75rem}
.card .num{display:block;font-size:1.45rem;font-weight:600;margin:6px 0 10px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width 1s ease}
.result{display:none;margin-top:18px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px}
.result.show{display:block;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.result h3{font-size:1.05rem;font-weight:600;margin-bottom:12px}
.result ul{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:.93rem}
.result li{display:flex;justify-content:space-between;gap:12px;color:var(--ink-dim)}
.result li b{color:var(--ok);font-weight:600;white-space:nowrap}
.foot{margin-top:26px;text-align:center;font-size:.8rem;color:var(--ink-dim)}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>

    <span class="plan-pill">Plano Avançado</span>
  </div>
  <div class="hello"><h1>Seu aparelho, mais rápido.</h1><p>Escolha o tipo e toque no botão. Nós cuidamos do resto.</p></div>

  <div class="stage">
    <svg class="ring" viewBox="0 0 270 270" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E90FF"/><stop offset="1" stop-color="#8A2BE2"/></linearGradient></defs><circle class="bg" cx="135" cy="135" r="120"/><circle class="fg" id="fg" cx="135" cy="135" r="120"/></svg>
    <div class="pulse" aria-hidden="true"></div>
    <button class="go" id="go" type="button">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 6c8 5 11 13 9 24l-5 4h-8l-5-4C13 19 16 11 24 6Z"/><circle cx="24" cy="19" r="3.4"/><path d="M19 34l-4 8 7-4M29 34l4 8-7-4"/></svg>
      <span class="lbl" id="lbl">Otimizar</span>
    </button>
  </div>

  <div class="status" id="status" aria-live="polite"><strong>Pronto para otimizar</strong>Leva menos de 2 minutos.</div>

  <div class="modes" id="modes">
    <button class="mode on" data-m="leve" type="button">Leve</button>
    <button class="mode" data-m="jogos" type="button">Jogos</button>
    <button class="mode" data-m="profunda" type="button">Profunda</button>
  </div>

  <div class="cards">
    <div class="card"><small>Memória em uso</small><span class="num" id="v0">78%</span><div class="bar"><i id="b0"></i></div></div>
    <div class="card"><small>Armazenamento</small><span class="num" id="v1">64%</span><div class="bar"><i id="b1"></i></div></div>
    <div class="card"><small>Desempenho</small><span class="num" id="v2">62</span><div class="bar"><i id="b2"></i></div></div>
  </div>

  <div class="result" id="result">
    <h3 id="rt">Tudo pronto!</h3>
    <ul id="rl"></ul>
  </div>
  <p class="foot">Demonstração da interface do Rocket Booster.</p>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const M={
  leve:{ms:5000,mb:[300,700],steps:['Analisando o aparelho…','Limpando arquivos temporários…','Liberando memória…'],extra:['Cache limpo','Memória liberada']},
  jogos:{ms:7000,mb:[500,1100],steps:['Analisando jogos e apps…','Fechando processos pesados…','Ajustando desempenho…','Liberando memória…'],extra:['Apps pesados pausados','Desempenho em jogos ajustado']},
  profunda:{ms:9000,mb:[1200,2400],steps:['Analisando o sistema…','Procurando arquivos não utilizados…','Limpando cache e temporários…','Otimizando memória…','Finalizando…'],extra:['Arquivos não usados removidos','Sistema otimizado em profundidade']}
};
let mode='leve',busy=false,s={ram:78,sto:64,perf:62};
const C=754;
function meters(){
  $('v0').textContent=Math.round(s.ram)+'%';$('b0').style.width=s.ram+'%';
  $('v1').textContent=Math.round(s.sto)+'%';$('b1').style.width=s.sto+'%';
  $('v2').textContent=Math.round(s.perf);$('b2').style.width=s.perf+'%';
}
setTimeout(meters,150);
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
  if(busy)return;mode=b.dataset.m;
  document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));
});
function fmt(mb){return mb>=1000?(mb/1000).toFixed(1).replace('.',',')+' GB':Math.round(mb)+' MB'}
$('go').onclick=function(){
  if(busy)return;
  busy=true;const cfg=M[mode],go=this;
  go.disabled=true;go.classList.remove('done');
  document.querySelectorAll('.mode').forEach(x=>x.disabled=true);
  $('result').classList.remove('show');
  $('app').classList.add('running');
  const before={...s};
  const start=performance.now();
  (function tick(now){
    const t=Math.min(1,(now-start)/cfg.ms);
    $('fg').style.strokeDashoffset=C*(1-t);
    go.innerHTML='<span class="lbl" style="font-size:2.4rem">'+Math.round(t*100)+'%</span>';
    const i=Math.min(cfg.steps.length-1,Math.floor(t*cfg.steps.length));
    $('status').innerHTML='<strong>Otimizando…</strong>'+cfg.steps[i];
    if(t<1){requestAnimationFrame(tick);return}
    finish(before,cfg,go);
  })(start);
};
function finish(before,cfg,go){
  const freed=cfg.mb[0]+Math.random()*(cfg.mb[1]-cfg.mb[0]);
  s.ram=Math.max(32,before.ram-(mode==='leve'?14:mode==='jogos'?24:30));
  s.sto=Math.max(40,before.sto-(mode==='profunda'?9:mode==='jogos'?4:3));
  s.perf=Math.min(97,before.perf+(mode==='leve'?14:mode==='jogos'?22:28));
  meters();
  go.innerHTML='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 25l8 8 16-18"/></svg><span class="lbl">Otimizar de novo</span>';
  go.classList.add('done');go.disabled=false;
  $('app').classList.remove('running');
  $('status').innerHTML='<strong>Aparelho otimizado!</strong>Você liberou '+fmt(freed)+'.';
  $('rt').textContent='O que foi feito';
  $('rl').innerHTML='<li><span>Espaço liberado</span><b>'+fmt(freed)+'</b></li><li><span>Memória em uso</span><b>'+Math.round(before.ram)+'% → '+Math.round(s.ram)+'%</b></li><li><span>Desempenho</span><b>'+Math.round(before.perf)+' → '+Math.round(s.perf)+'</b></li>'+cfg.extra.map(e=>'<li><span>'+e+'</span><b>✓</b></li>').join('');
  $('result').classList.add('show');
  document.querySelectorAll('.mode').forEach(x=>x.disabled=false);
  busy=false;
  $('fg').style.strokeDashoffset=C;
}
})();
</script>
</body>
</html>
